<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Turaan Search Results</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="search-page">
    <main class="search-page__card">
      <header class="search-page__header">
        <div class="search-page__title">Turaan Search</div>
        <div class="search-page__query" id="query">Searching for...</div>
      </header>

      <section class="results" id="results"></section>

      <div class="search-page__actions">
        <a class="button" id="web-search" href="#" target="_blank" rel="noreferrer">
          Search the web
        </a>
        <a class="button button--ghost" href="index.html">Back to New Tab</a>
      </div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const query = params.get("q") || "Turaan";
      const queryText = document.getElementById("query");
      const results = document.getElementById("results");
      const webSearch = document.getElementById("web-search");
      const encoded = encodeURIComponent(query);

      queryText.textContent = `Results for "${query}"`;
      webSearch.href = `search.html?q=${encoded}`;

      const items = [
        {
          title: `Learn about ${query}`,
          url: `https://en.wikipedia.org/wiki/${encoded}`,
          description: "Background and summaries pulled from trusted sources.",
        },
        {
          title: `${query} videos and tutorials`,
          url: `https://www.youtube.com/results?search_query=${encoded}`,
          description: "Curated walkthroughs to help you go deeper.",
        },
        {
          title: `Latest news on ${query}`,
          url: `https://news.google.com/search?q=${encoded}`,
          description: "Fresh headlines collected across the web.",
        },
        {
          title: `${query} code repositories`,
          url: `https://github.com/search?q=${encoded}`,
          description: "Open-source projects and references.",
        },
      ];

      results.innerHTML = items
        .map(
          (item) => `
            <article class="result">
              <a href="${item.url}" target="_blank" rel="noreferrer">
                ${item.title}
              </a>
              <p>${item.description}</p>
              <div class="result__url">${item.url}</div>
            </article>
          `
        )
        .join("");
    </script>
  </body>
</html>
